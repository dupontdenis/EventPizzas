<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delegation d'evenements - EventPizzas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <script type="module" src="./app.mjs"></script>
</head>

<body>
  <main class="container py-4">
    <h1 class="h2 mb-3">Choisir une pizza</h1>
    <div class="mb-4">
      <button class="btn btn-outline-primary mb-2" data-pizza="queen">Pizza Queen</button>
      <button class="btn btn-outline-primary mb-2" data-pizza="margherita">Pizza Margherita</button>
    </div>

    <div id="pizza-details">
      <div id="queen" class="border rounded p-3" hidden>
        <h2 class="h4">Pizza Queen</h2>
        <p class="mb-0">🍅Sauce tomate, 🧀mozzarella, 🐖jambon et 🍄‍🟫champignons.</p>
      </div>

      <div id="margherita" class="border rounded p-3" hidden>
        <h2 class="h4">Pizza Margherita</h2>
        <p class="mb-0">🍅Sauce tomate, 🧀mozzarella et 🍃basilic.</p>
      </div>
    </div>
  </main>

</body>

</html>
